# Local development Postgres for the PIK backend.
#   npm run db:up      → start (waits until healthy)
#   npm run db:down    → stop
#   npm run db:reset   → wipe + restart
# Credentials match the DATABASE_URL in .env.example.
services:
  db:
    image: postgres:16-alpine
    container_name: pik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pik
    ports:
      - "5432:5432"
    volumes:
      - pik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pik"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pik-pgdata:
